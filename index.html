<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAKO MARKET - Escrow Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .platform-tiktok { border-left: 4px solid #ff0050; }
        .platform-youtube { border-left: 4px solid #ff0000; }
        .platform-instagram { border-left: 4px solid #e1306c; }
        .platform-telegram { border-left: 4px solid #0088cc; }
        .platform-facebook { border-left: 4px solid #1877f2; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-40 glass px-4 py-3 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-teal-400 flex items-center justify-center font-bold text-lg text-white shadow-lg">DM</div>
            <div>
                <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">DAKO MARKET</h1>
                <p class="text-[10px] text-gray-400">Escrow Digital Marketplace</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <a href="tel:0961990973" class="flex items-center gap-1 bg-gray-800 text-xs text-green-400 px-3 py-1.5 rounded-full border border-gray-700">
                <i class="fa-solid fa-phone"></i> <span>0961990973</span>
            </a>
            <button onclick="toggleAdmin()" id="adminBtn" class="bg-gray-800 text-gray-300 text-xs px-3 py-1.5 rounded-lg border border-gray-700">Admin</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-md mx-auto px-4 py-4 space-y-4">
        
        <!-- Market View -->
        <div id="marketSection" class="space-y-4">
            <!-- Banner -->
            <div class="glass p-4 rounded-2xl border border-blue-500/20">
                <div class="text-xs text-blue-400 font-semibold mb-1"><i class="fa-solid fa-shield-halved"></i> 100% በሰዎች Escrow የተጠበቀ</div>
                <p class="text-sm text-gray-200">የሶሻል ሚዲያ አካውንቶችን በደህና ይግዙ ወይም ይሸጡ!</p>
            </div>

            <!-- Stats -->
            <div class="glass p-3 rounded-xl flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-lg bg-blue-500/10 flex items-center justify-center text-blue-400"><i class="fa-solid fa-store"></i></div>
                    <div>
                        <p class="text-[11px] text-gray-400">አጠቃላይ አካውንቶች</p>
                        <p id="totalCount" class="text-base font-bold text-white">2 አካውንቶች</p>
                    </div>
                </div>
            </div>

            <!-- Filters -->
            <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
                <button onclick="filterList('all')" class="bg-blue-600 text-white px-4 py-2 rounded-xl whitespace-nowrap">ሁሉም</button>
                <button onclick="filterList('TikTok')" class="glass text-gray-300 px-4 py-2 rounded-xl whitespace-nowrap">TikTok</button>
                <button onclick="filterList('YouTube')" class="glass text-gray-300 px-4 py-2 rounded-xl whitespace-nowrap">YouTube</button>
            </div>

            <!-- Listings -->
            <div id="listingsDiv" class="space-y-3"></div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboardSection" class="space-y-4 hidden">
            <div class="glass p-4 rounded-2xl space-y-3">
                <h3 class="font-bold text-white text-base"><i class="fa-solid fa-chart-pie text-blue-400"></i> የሻጭ ዳሽቦርድ</h3>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                        <p class="text-gray-400 text-[10px]">የተቆለፈበት ብር (Escrow)</p>
                        <p class="text-base font-bold text-amber-400 mt-1">4,050 ETB</p>
                    </div>
                    <div class="bg-gray-900 p-3 rounded-xl border border-gray-800">
                        <p class="text-gray-400 text-[10px]">የተለቀቀ ብር</p>
                        <p class="text-base font-bold text-green-400 mt-1">8,100 ETB</p>
                    </div>
                </div>
                <div class="pt-2 border-t border-gray-800 space-y-2">
                    <p class="text-xs font-bold text-white">ብር ማውጫ ማመልከቻ</p>
                    <select id="bankName" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                        <option>Telebirr</option>
                        <option>CBE Birr</option>
                    </select>
                    <input type="text" id="accNumber" placeholder="የሂሳብ/ስልክ ቁጥር" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
                    <button onclick="withdrawMoney()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">ማመልከቻ ላክ</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Buy Modal -->
    <div id="buyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="glass p-5 rounded-2xl max-w-sm w-full space-y-4 border border-gray-700">
            <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                <h3 class="font-bold text-white text-sm">የ Escrow ክፍያ</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p id="modalPriceText" class="text-amber-400 font-extrabold text-sm"></p>
            
            <div class="bg-gray-900 p-3 rounded-xl text-xs space-y-1 border border-gray-800">
                <p class="text-sky-400 font-bold">Telebirr: 0961990973 (Addisu)</p>
                <p class="text-purple-400 font-bold">CBE: 0912122880 (Balemlay)</p>
            </div>

            <input type="text" id="buyerPhone" placeholder="ስልክ ቁጥርዎ" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-2.5 text-xs text-white">
            <input type="file" id="receipt" class="w-full text-xs text-gray-400 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-blue-600 file:text-white">
            
            <button onclick="confirmBuy()" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-xl text-xs">ክፍያ ላክ</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-gray-800 py-2 px-6 flex justify-between items-center z-40 max-w-md mx-auto">
        <button onclick="showTab('market')" id="tabMarket" class="flex flex-col items-center gap-1 text-blue-400">
            <i class="fa-solid fa-shop text-lg"></i><span class="text-[10px]">ገበያ</span>
        </button>
        <button onclick="showTab('dashboard')" id="tabDash" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-chart-pie text-lg"></i><span class="text-[10px]">ዳሽቦርድ</span>
        </button>
        <button onclick="alert('አካውንት ለመለጠፍ በ 0961990973 ይደውሉ')" class="w-12 h-12 rounded-full bg-blue-600 flex items-center justify-center text-white shadow-lg -mt-6">
            <i class="fa-solid fa-plus text-xl"></i>
        </button>
        <button onclick="window.location.href='tel:0961990973'" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-phone text-lg"></i><span class="text-[10px]">ደውል</span>
        </button>
        <button onclick="toggleAdmin()" class="flex flex-col items-center gap-1 text-gray-400 hover:text-white">
            <i class="fa-solid fa-user-shield text-lg"></i><span class="text-[10px]">Admin</span>
        </button>
    </nav>

    <script>
        let isAdmin = false;
        const listings = [
            { id: 1, title: "Addise news", platform: "YouTube", subs: "22,000", price: 9000, share: 8100 },
            { id: 2, title: "1000tiktok", platform: "TikTok", subs: "15,000", price: 4500, share: 4050 }
        ];

        function renderListings(filter) {
            const container = document.getElementById('listingsDiv');
            const items = filter === 'all' ? listings : listings.filter(i => i.platform === filter);
            
            container.innerHTML = items.map(item => `
                <div class="glass p-4 rounded-2xl space-y-3 platform-${item.platform.toLowerCase()}">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-[10px] uppercase font-bold text-blue-400 bg-blue-500/10 px-2 py-0.5 rounded-md">${item.platform}</span>
                            <h3 class="font-bold text
